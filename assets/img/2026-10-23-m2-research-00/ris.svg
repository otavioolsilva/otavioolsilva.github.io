<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for Arrowheads and Patterns -->
    <defs>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3498db" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ecc71" />
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />
    <text x="460" y="68" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Compromised RIS</text>

    <!-- Base Station (Transmitter) -->
    <g id="base-station">
        <!-- Mast -->
        <path d="M 80 500 L 120 500 L 110 320 L 90 320 Z" fill="#7f8c8d" />
        <path d="M 100 320 L 100 280" stroke="#7f8c8d" stroke-width="4" />
        <circle cx="100" cy="280" r="6" fill="#2c3e50" />
        <!-- Radio Waves -->
        <path d="M 85 260 Q 100 245 115 260" fill="none" stroke="#3498db" stroke-width="2" />
        <path d="M 75 250 Q 100 225 125 250" fill="none" stroke="#3498db" stroke-width="2" />
        <text x="100" y="525" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Base Station</text>
        <text x="100" y="540" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">(Source)</text>
    </g>

    <!-- Obstacle (Building/Wall) -->
    <g id="obstacle">
        <rect x="280" y="270" width="80" height="230" fill="#bdc3c7" stroke="#95a5a6" stroke-width="3" rx="4" />
        <!-- Windows -->
        <rect x="295" y="290" width="20" height="30" fill="#ecf0f1" />
        <rect x="325" y="290" width="20" height="30" fill="#ecf0f1" />
        <rect x="295" y="340" width="20" height="30" fill="#ecf0f1" />
        <rect x="325" y="340" width="20" height="30" fill="#ecf0f1" />
        <text x="320" y="525" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Obstacle</text>
    </g>

    <!-- Blocked Line of Sight -->
    <line x1="100" y1="280" x2="280" y2="350" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="280" cy="350" r="5" fill="#e74c3c" />
    <text x="175" y="330" font-family="sans-serif" font-size="12" fill="#e74c3c" font-weight="bold" transform="rotate(21 175 345)">Blocked</text>

    <!-- RIS Surface -->
    <g id="ris" transform="translate(420, 80) rotate(-15) skewY(20)">
        <rect width="80" height="100" fill="#e0f7fa" stroke="#00838f" stroke-width="2" />
        <!-- Metasurface Grid -->
        <path d="M0,20 L80,20 M0,40 L80,40 M0,60 L80,60 M0,80 L80,80 M20,0 L20,100 M40,0 L40,100 M60,0 L60,100" stroke="#00838f" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Legitimate User Equipment -->
    <g id="user-equipment">
        <rect x="520" y="450" width="30" height="50" rx="4" fill="#34495e" />
        <rect x="523" y="453" width="24" height="38" rx="2" fill="#ecf0f1" />
        <circle cx="535" cy="496" r="2" fill="#ecf0f1" />
        <text x="535" y="525" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#2ecc71">Legitimate UE</text>
        <text x="535" y="540" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">(Intended Target)</text>
    </g>

    <!-- Eavesdropper -->
    <g id="eavesdropper">
        <!-- Laptop -->
        <rect x="700" y="280" width="40" height="25" rx="2" fill="#2c3e50" />
        <polygon points="690,305 750,305 740,315 700,315" fill="#7f8c8d" />
        <text x="720" y="340" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#e74c3c">Eavesdropper</text>
        <text x="720" y="355" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">(Attacker)</text>
    </g>

    <!-- Signal Paths -->
    <!-- Tx to RIS -->
    <path d="M 100 280 L 440 130" stroke="#3498db" stroke-width="3" marker-end="url(#arrowBlue)" stroke-dasharray="8,4" />
    <text x="240" y="200" font-family="sans-serif" font-size="14" fill="#3498db" font-weight="bold" transform="rotate(-26 250 190)">Original Signal</text>

    <!-- RIS to UE -->
    <path d="M 470 140 L 530 440" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrowGreen)" stroke-dasharray="8,4" />
    <text x="485" y="310" font-family="sans-serif" font-size="14" fill="#2ecc71" font-weight="bold" transform="rotate(78 485 310)">Directed Beam</text>

    <!-- RIS to Eavesdropper -->
    <path d="M 470 140 L 695 290" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowRed)" stroke-dasharray="8,4" />
    <text x="550" y="208" font-family="sans-serif" font-size="14" fill="#e74c3c" font-weight="bold" transform="rotate(32 590 210)">Malicious Redirection</text>

</svg>
